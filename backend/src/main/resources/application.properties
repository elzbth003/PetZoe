spring.application.name=petzoe-api
server.port=8080

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/petzoe_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
# Base64 encoded secret key of at least 256 bits
petzoe.jwt.secret=9a72d737ae494191a613f1c1f6d338f0dcd01abaf6f35de98516d2673d3284bb9a72d737ae494191a613f1c1f6d338f0dcd01abaf6f35de98516d2673d3284bb
# Token Expiration: 24 Hours in milliseconds (86,400,000 ms)
petzoe.jwt.expiration=86400000

# Google OAuth2 Configuration
# Set this to your Google Cloud Console OAuth2 Client ID
petzoe.google.client-id=${GOOGLE_CLIENT_ID:895031867913-klb2ojtmcojvku4vf04umkbvebjfpfe7.apps.googleusercontent.com}

