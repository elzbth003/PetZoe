spring.application.name=petzoe-api
server.port=8080

# Database Configuration (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/petzoe_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
# Base64 encoded secret key of at least 256 bits. The fallback below is a dev-only
# default — override with a real secret via the JWT_SECRET env var in any shared/
# production environment, since anyone with this value can forge valid tokens.
petzoe.jwt.secret=${JWT_SECRET:9a72d737ae494191a613f1c1f6d338f0dcd01abaf6f35de98516d2673d3284bb9a72d737ae494191a613f1c1f6d338f0dcd01abaf6f35de98516d2673d3284bb}
# Token Expiration: 7 Days in milliseconds (604,800,000 ms)
petzoe.jwt.expiration=604800000

# Google OAuth2 Configuration
# Set this to your Google Cloud Console OAuth2 Client ID
petzoe.google.client-id=${GOOGLE_CLIENT_ID:895031867913-klb2ojtmcojvku4vf04umkbvebjfpfe7.apps.googleusercontent.com}

# PetZoe AI Assistant Configuration (Gemini API)
petzoe.ai.provider=${AI_PROVIDER:GEMINI}
petzoe.ai.gemini.api-key=${GEMINI_API_KEY:}
petzoe.ai.model=${AI_MODEL:gemini-1.5-flash}
petzoe.ai.temperature=${AI_TEMPERATURE:0.4}

# PetZoe AI Assistant Controlled Web Retrieval Configuration
petzoe.web.enabled=${WEB_SEARCH_ENABLED:true}
petzoe.web.provider=${WEB_SEARCH_PROVIDER:CURATED_VET}
petzoe.web.max-results=${WEB_SEARCH_MAX_RESULTS:5}
petzoe.web.max-sources=${WEB_SEARCH_MAX_SOURCES:3}
petzoe.web.timeout-ms=${WEB_SEARCH_TIMEOUT_MS:4000}
petzoe.web.allowed-domains=${WEB_SEARCH_ALLOWED_DOMAINS:wsava.org,aaha.org,avma.org,ncbi.nlm.nih.gov,pubmed.ncbi.nlm.nih.gov,vetmed.ucdavis.edu,vet.cornell.edu,cdc.gov,fda.gov}
petzoe.web.cache-ttl-seconds=${WEB_SEARCH_CACHE_TTL:3600}
petzoe.web.google.api-key=${GOOGLE_SEARCH_API_KEY:}
petzoe.web.google.cx=${GOOGLE_SEARCH_CX:}

# PetZoe VetScan AI Service Configuration
petzoe.vetscan.service-url=${VETSCAN_SERVICE_URL:http://127.0.0.1:8001}
petzoe.vetscan.model-mode=${VETSCAN_MODEL_MODE:mock}

# Razorpay Payment Gateway Configuration (TEST MODE)
petzoe.razorpay.mode=${RAZORPAY_MODE:auto}
petzoe.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_TlH1DuyS6CYBx9}
petzoe.razorpay.key-secret=${RAZORPAY_KEY_SECRET:y0qhYgwkv5TVQaXfLV0cOWBDt}
petzoe.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:PetZoe_Test_Webhook_9xK4pL7mQ2}
petzoe.razorpay.currency=INR


